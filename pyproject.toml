[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustnet"
version = "0.1.0"
description = "TrustNet AI: a research prototype for evaluating and combining AI agent recommendations by trust."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "langgraph>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    # Imported directly for their exception types; both also arrive via langchain-ollama.
    "ollama>=0.6,<1",
    "httpx>=0.27,<1",
]

# Later phases are declared as extras so each phase installs only what it uses.
# None of these extras (except dev) are imported by the current code.
[project.optional-dependencies]
dev = ["pytest>=8,<9"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
ui = ["streamlit>=1.38,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
